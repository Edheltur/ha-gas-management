title: Учёт газа
views:
  - title: Баллоны
    path: gas
    icon: mdi:gas-cylinder
    cards:
      - type: vertical-stack
        cards:
          - type: entities
            title: Баллон CO₂
            show_header_toggle: false
            entities:
              - entity: sensor.co2_gas_remaining
                name: Остаток газа
              - entity: sensor.co2_fill_level
                name: Заполнение
              - entity: number.co2_equipment_weight
                name: Вес оснастки
              - entity: number.co2_total_weight
                name: Общий вес
          - type: history-graph
            title: История остатка
            hours_to_show: 48
            entities:
              - entity: sensor.co2_gas_remaining
                name: Остаток газа
